# =============================================
# JEWELRY SHOP - APPLICATION CONFIGURATION
# =============================================

# Server
server.port=8080

# =============================================
# DATABASE - SQL SERVER
# =============================================
# Thay 'localhost' và 'sa' / 'your_password' theo máy của bạn
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=valkey;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true
# Buộc Hibernate dùng NVARCHAR thay vì VARCHAR → giữ đúng tiếng Việt
spring.jpa.properties.hibernate.use_nationalized_character_data=true

