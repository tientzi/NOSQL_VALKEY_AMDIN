# =============================================
# OAUTH2 - GOOGLE & FACEBOOK LOGIN
# =============================================
# === GOOGLE ===
# Hướng dẫn lấy credentials:
#   1. Vào: https://console.cloud.google.com -> APIs & Services -> Credentials
#   2. Tạo OAuth 2.0 Client ID (loại: Web application)
#   3. Thêm Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
#   4. Copy Client ID và Client Secret, điền vào 2 dòng bên dưới
#
# CÁCH 1: Điền trực tiếp (chỉ dùng cho local dev, KHÔNG commit lên Git)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
#spring.security.oauth2.client.registration.facebook.client-id=your-facebook-app-id
#spring.security.oauth2.client.registration.facebook.client-secret=your-facebook-app-secret
#spring.security.oauth2.client.registration.facebook.scope=email,public_profile
#spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
#spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
#spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
#spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# URL redirect về frontend sau OAuth2
app.oauth2.authorized-redirect-uri=http://localhost:8080/oauth2/callback

# =============================================
# VALKEY (REDIS COMPATIBLE) QUEUE & STREAM CONFIG
# =============================================
spring.data.redis.host=${VALKEY_HOST:localhost}
spring.data.redis.port=${VALKEY_PORT:6379}
spring.data.redis.timeout=3000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Valkey Queue & Stream Namespaces
valkey.queue.orders.stream=mm:queue:orders
valkey.queue.orders.group=mm-order-workers
valkey.queue.orders.dead-stream=mm:queue:orders:dead

# Valkey Admin Web GUI URL
valkey.admin.url=${VALKEY_ADMIN_URL:http://localhost:8085}
