# ==============================================================================
# VALKEY CONFIGURATION CHO HE THONG HANG DOI MINI MARKET
# ==============================================================================

# Mang & Cong ket noi
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Che do van hanh (chay foreground trong container)
daemonize no
supervised no
pidfile /var/run/valkey_6379.pid
loglevel notice
logfile ""

# Co so du lieu
databases 16

# ==============================================================================
# CHINH SACH LUU BEN (PERSISTENCE) CHO HANG DOI VA TRANSACTIONAL OUTBOX
# ==============================================================================

# 1. RDB Snapshots (Chup anh dinh ky)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 2. AOF (Append Only File) - Bat buoc cho Queue & Stream de tranh mat Job
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ==============================================================================
# QUAN LY BO NHO (MEMORY MANAGEMENT)
# ==============================================================================
# Gioi han RAM 512MB cho moi truong dev/test
maxmemory 512mb

# QUAN TRONG: Chinh sach noeviction - KHONG tu dong xoa Stream/Job khi day bo nho!
# Khi day RAM se tra ve loi de he thong biet ma canh bao, tranh that thoat don hang.
maxmemory-policy noeviction

# ==============================================================================
# TOI UU CHO VALKEY STREAM (RADIX TREE NODE)
# ==============================================================================
stream-node-max-bytes 4096
stream-node-max-entries 100
